name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The tree-sitter grammars are compiled from C, so a C compiler is
      # needed. The GitHub runners have one for every platform.
      - name: Cache the cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repomix-rs/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('repomix-rs/Cargo.lock') }}

      - name: Build
        working-directory: repomix-rs
        run: cargo build --release

      - name: Test
        working-directory: repomix-rs
        run: cargo test --release

      - name: Check that the binary runs
        working-directory: repomix-rs
        run: ./target/release/repomix --version

  # A single self contained binary that can be downloaded and run on any
  # Windows machine.
  release:
    name: release binary
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: repomix-rs
        run: cargo build --release

      # The binary must not depend on the Visual C++ redistributable.
      - name: Check the imports
        run: ./portable-check.ps1 -Path ./repomix-rs/target/release/repomix.exe

      - name: Package
        shell: pwsh
        run: |
          $version = (Get-Content ./repomix-rs/Cargo.toml | Select-String '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $stage = "repomix-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item ./repomix-rs/target/release/repomix.exe "$stage/repomix.exe"
          Copy-Item ./README.md "$stage/README.md"
          Copy-Item ./LICENSE "$stage/LICENSE"
          Compress-Archive -Path $stage -DestinationPath "repomix-$version-windows-x64.zip"
          Remove-Item $stage -Recurse -Force

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: repomix-windows-x64
          path: repomix-*-windows-x64.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: repomix-*-windows-x64.zip
          generate_release_notes: true
