name: CI & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repomix-rs/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('repomix-rs/Cargo.lock') }}

      - name: Build
        working-directory: repomix-rs
        run: cargo build --release

      - name: Test
        working-directory: repomix-rs
        run: cargo test --release

      - name: Check binary runs
        working-directory: repomix-rs
        run: ./target/release/repomix --version

  release:
    name: Release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
            cross_aarch64: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux aarch64 cross-compiler
        if: matrix.cross_aarch64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Release Binary
        working-directory: repomix-rs
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Zip Archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $bin = "repomix-rs/target/${{ matrix.target }}/release/repomix.exe"
          Compress-Archive -Path $bin, LICENSE, README.md -DestinationPath "repomix-${{ matrix.target }}.zip"

      - name: Package Unix Tarball Archive
        if: matrix.archive_ext == 'tar.gz'
        run: |
          BIN="repomix-rs/target/${{ matrix.target }}/release/repomix"
          tar -czf "repomix-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" repomix

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repomix-${{ matrix.target }}
          path: repomix-${{ matrix.target }}.${{ matrix.archive_ext }}

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: repomix-${{ matrix.target }}.${{ matrix.archive_ext }}
          generate_release_notes: true
