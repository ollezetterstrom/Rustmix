name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            repomix-rs/target
          key: ubuntu-cargo-${{ hashFiles('repomix-rs/Cargo.lock') }}

      - name: Build
        working-directory: repomix-rs
        run: cargo build --release

      - name: Test
        working-directory: repomix-rs
        run: cargo test --release

      - name: Check binary runs
        working-directory: repomix-rs
        run: ./target/release/rustmix --version
