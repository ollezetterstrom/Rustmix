name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        working-directory: repomix-rs
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Zip Archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $bin = "repomix-rs/target/${{ matrix.target }}/release/rustmix.exe"
          Compress-Archive -Path $bin, LICENSE, README.md -DestinationPath "rustmix-${{ matrix.target }}.zip"

      - name: Package Unix Tarball Archive
        if: matrix.archive_ext == 'tar.gz'
        run: |
          BIN="repomix-rs/target/${{ matrix.target }}/release/rustmix"
          tar -czf "rustmix-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" rustmix

      - name: Upload Raw Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-binary-${{ matrix.target }}
          path: |
            repomix-rs/target/${{ matrix.target }}/release/rustmix
            repomix-rs/target/${{ matrix.target }}/release/rustmix.exe
          if-no-files-found: error

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: rustmix-${{ matrix.target }}.${{ matrix.archive_ext }}
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download all raw binaries
        uses: actions/download-artifact@v4
        with:
          path: downloaded-binaries

      - name: Prepare npm packages
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version $VERSION"

          # Copy binaries to matching platform directories
          cp downloaded-binaries/raw-binary-x86_64-pc-windows-msvc/rustmix.exe npm/rustmix-win32-x64/bin/rustmix.exe
          cp downloaded-binaries/raw-binary-x86_64-unknown-linux-gnu/rustmix npm/rustmix-linux-x64/bin/rustmix
          cp downloaded-binaries/raw-binary-aarch64-unknown-linux-gnu/rustmix npm/rustmix-linux-arm64/bin/rustmix
          cp downloaded-binaries/raw-binary-aarch64-apple-darwin/rustmix npm/rustmix-darwin-arm64/bin/rustmix
          cp downloaded-binaries/raw-binary-x86_64-apple-darwin/rustmix npm/rustmix-darwin-x64/bin/rustmix

          # Ensure execute permissions
          chmod +x npm/rustmix-linux-x64/bin/rustmix
          chmod +x npm/rustmix-linux-arm64/bin/rustmix
          chmod +x npm/rustmix-darwin-arm64/bin/rustmix
          chmod +x npm/rustmix-darwin-x64/bin/rustmix
          chmod +x npm/rustmix/bin/rustmix.js

          # Update version in all 6 package.json files
          for pkg in npm/rustmix npm/rustmix-*; do
            node -e "
              const fs = require('fs');
              const file = '$pkg/package.json';
              const p = JSON.parse(fs.readFileSync(file, 'utf8'));
              p.version = '$VERSION';
              if (p.optionalDependencies) {
                for (const k of Object.keys(p.optionalDependencies)) {
                  p.optionalDependencies[k] = '$VERSION';
                }
              }
              fs.writeFileSync(file, JSON.stringify(p, null, 2) + '\n');
            "
          done

      - name: Publish platform packages to npm
        run: |
          for pkg in npm/rustmix-win32-x64 npm/rustmix-linux-x64 npm/rustmix-linux-arm64 npm/rustmix-darwin-arm64 npm/rustmix-darwin-x64; do
            echo "Publishing $pkg..."
            npm publish "$pkg" --access public
          done

      - name: Publish main @ollezetterstrom/rustmix package to npm
        run: |
          echo "Publishing npm/rustmix..."
          npm publish npm/rustmix --access public
