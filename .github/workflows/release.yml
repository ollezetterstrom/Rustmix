name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: tar.gz

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        working-directory: repomix-rs
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Zip Archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $bin = "repomix-rs/target/${{ matrix.target }}/release/rustmix.exe"
          Compress-Archive -Path $bin, LICENSE, README.md -DestinationPath "rustmix-${{ matrix.target }}.zip"

      - name: Package Unix Tarball Archive
        if: matrix.archive_ext == 'tar.gz'
        run: |
          BIN="repomix-rs/target/${{ matrix.target }}/release/rustmix"
          tar -czf "rustmix-${{ matrix.target }}.tar.gz" -C "$(dirname "$BIN")" rustmix

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: rustmix-${{ matrix.target }}.${{ matrix.archive_ext }}
          generate_release_notes: true
