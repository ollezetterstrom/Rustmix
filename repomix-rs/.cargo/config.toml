# Link the C runtime statically on Windows, so that the binary is a single
# file that runs on any Windows machine without the Visual C++
# redistributable.
#
# The reference implementation needs a Node runtime and an 87 MB dependency
# tree; this binary should not need anything but itself.
#
# Two things are needed for that:
#   * the Rust code links the CRT statically (+crt-static), and
#   * the C code of the tree-sitter grammars is compiled with /MT, otherwise
#     it pulls the dynamic runtime back in.
#
# The flags are scoped to the MSVC target on purpose: +crt-static is not
# usable for the Apple targets, and the build has to keep working on Linux
# and macOS.
#
# NOTE: cargo reads this file from the *working directory*, so the build has
# to run inside the crate directory ("cd repomix-rs" first). install.ps1 and
# "cargo install --path ." both do.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Compile the C code of the tree-sitter grammars with the static runtime.
# The variable name is target specific, so it is ignored on other platforms.
CFLAGS_x86_64_pc_windows_msvc = "/MT"
