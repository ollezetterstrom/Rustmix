[package]
name = "repomix-rs"
version = "1.18.1"
edition = "2021"
rust-version = "1.80"
description = "High-performance drop-in replacement for the Repomix codebase packer, written in Rust"
license = "MIT"
repository = "https://github.com/yamadashy/repomix"
readme = "README.md"
keywords = ["repomix", "ai", "llm", "packer", "codebase"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "repomix"
path = "src/main.rs"

# The development tools are not installed by "cargo install".
[[bin]]
name = "bench_prims"
path = "src/bin/bench_prims.rs"
required-features = ["dev"]

[[bin]]
name = "calib"
path = "src/bin/calib.rs"
required-features = ["dev"]

[[bin]]
name = "regexbench"
path = "src/bin/regexbench.rs"
required-features = ["dev"]

[[bin]]
name = "bench_tok"
path = "src/bin/bench_tok.rs"
required-features = ["dev"]

[[bin]]
name = "tokdiff"
path = "src/bin/tokdiff.rs"
required-features = ["dev"]

[[bin]]
name = "tokprefix"
path = "src/bin/tokprefix.rs"
required-features = ["dev"]

[features]
dev = ["dep:fancy-regex"]

[dependencies.fancy-regex]
version = "0.19"
optional = true

[dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "wrap_help"] }
# Filesystem traversal / ignore handling
ignore = "0.4"
globset = "0.4"
# Parallelism
rayon = "1.12"
# Token counting
tiktoken-rs = "0.12"
# SIMD substring search (the memchr crate is already in the tree via aho-corasick)
memchr = "2.7"
# Regex pre-tokenisation (dev only: used to verify the fast pre-tokeniser)
# SIMD UTF-8 validation
simdutf8 = "0.1"
# Tree-sitter parsing for --compress
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-php = "0.25"
tree-sitter-swift = "0.7"
tree-sitter-css = "0.25"
tree-sitter-solidity = "1.2"
tree-sitter-dart = "0.2"
# Serialization / config
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "1.3"
# Secret detection
aho-corasick = "1"
regex = "1.13"
# Clipboard
arboard = "3.7"
# Errors / logging
anyhow = "1"
thiserror = "2"
log = "0.4"
env_logger = "0.11"
# Misc
unicode-width = "0.2"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
